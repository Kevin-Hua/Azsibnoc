<main><h1>易混淆字群</h1><details open id="u6625"><summary>春／蠢／奉／奏／泰／表</summary><p>先比下半部：春下有日，蠢在春下又有兩個虫，泰的下部像水；再比較奉、奏、表的收筆。</p><div class="tiles"><a href="char/6625.html">春</a><a href="char/8822.html">蠢</a><a href="char/5949.html">奉</a><a href="char/594f.html">奏</a><a href="char/6cf0.html">泰</a><a href="char/8868.html">表</a></div></details><details open id="u672a"><summary>未／末／朱／夫／失／矢</summary><p>未的上橫較短，末的上橫較長；朱另有起筆短撇。比較夫、失、矢時，留意起筆和中間直筆是否出頭。</p><div class="tiles"><a href="char/672a.html">未</a><a href="char/672b.html">末</a><a href="char/6731.html">朱</a><a href="char/592b.html">夫</a><a href="char/5931.html">失</a><a href="char/77e2.html">矢</a></div></details><details open id="u5df3"><summary>巳／已／己</summary><p>看左側開口：己開口，已的豎筆到中間，巳封口。</p><div class="tiles"><a href="char/5df3.html">巳</a><a href="char/5df2.html">已</a><a href="char/5df1.html">己</a></div></details></main><footer>Azsibnoc · v0.1.0 · 可離線瀏覽</footer></html>
